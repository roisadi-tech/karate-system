{% extends 'base.html' %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">
            ✏️ Editar Turma
        </h2>

        <p class="text-muted mb-0">
            Atualize os dados da turma
        </p>

    </div>

</div>

<div class="card border-0 shadow-sm p-4 rounded-4">

    <form method="POST">

        <div class="row g-3">

            <div class="col-md-12">

                <label class="form-label fw-semibold">
                    Nome da Turma
                </label>

                <input
                    type="text"
                    name="nome"
                    value="{{ turma.nome }}"
                    class="form-control form-control-lg"
                    required
                >

            </div>

            <div class="col-md-6">

                <label class="form-label fw-semibold">
                    Professor Responsável
                </label>

                <select
                    name="professor_id"
                    class="form-select form-select-lg"
                >

                    <option
                        value=""
                        {% if not turma.professor_id %}
                            selected
                        {% endif %}
                    >
                        Selecione
                    </option>

                    {% for professor in professores %}

                        <option
                            value="{{ professor.id }}"
                            {% if turma.professor_id == professor.id %}
                                selected
                            {% endif %}
                        >
                            {{ professor.nome }}
                        </option>

                    {% endfor %}

                </select>

            </div>

            <div class="col-md-6">

                <label class="form-label fw-semibold">
                    Horário
                </label>

                <input
                    type="text"
                    name="horario"
                    value="{{ turma.horario or '' }}"
                    class="form-control form-control-lg"
                    placeholder="Ex: 18h às 19h"
                >

            </div>

            <div class="col-md-12">

                <label class="form-label fw-semibold">
                    Dias da Semana
                </label>

                <input
                    type="text"
                    name="dias"
                    value="{{ turma.dias or '' }}"
                    class="form-control form-control-lg"
                    placeholder="Ex: Segunda, Quarta e Sexta"
                >

            </div>

            <div class="col-md-12">

                <label class="form-label fw-semibold">
                    Observação
                </label>

                <textarea
                    name="observacao"
                    class="form-control"
                    rows="4"
                    placeholder="Ex: Turma infantil iniciante"
                >{{ turma.observacao or '' }}</textarea>

            </div>

        </div>

        <div class="mt-5 d-flex gap-3">

            <button class="btn btn-warning text-white btn-lg px-4">

                <i class="bi bi-save-fill"></i>
                Salvar Alterações

            </button>

            <a
                href="/turmas"
                class="btn btn-secondary btn-lg px-4"
            >
                Voltar
            </a>

        </div>

    </form>

</div>

{% endblock %}
