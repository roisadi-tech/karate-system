{% extends 'base.html' %}

{% block conteudo %}

<h1 class="mb-4">
    Relatórios
</h1>

<div class="row mb-4">

    <div class="col-md-4">

        <div class="card bg-primary text-white shadow-sm">

            <div class="card-body">

                <h5>
                    Total de Alunos
                </h5>

                <h2>
                    {{ total_alunos }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card bg-success text-white shadow-sm">

            <div class="card-body">

                <h5>
                    Total Recebido
                </h5>

                <h2>
                    R$ {{ recebido }}
                </h2>

            </div>

        </div>

    </div>

    <div class="col-md-4">

        <div class="card bg-danger text-white shadow-sm">

            <div class="card-body">

                <h5>
                    Total Pendente
                </h5>

                <h2>
                    R$ {{ pendente }}
                </h2>

            </div>

        </div>

    </div>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <h4 class="mb-4">
            Alunos por Faixa
        </h4>

        <canvas id="graficoFaixas"></canvas>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx = document.getElementById('graficoFaixas');

new Chart(ctx, {

    type: 'bar',

    data: {

        labels: [

            {% for faixa in faixas %}

                '{{ faixa[0] }}',

            {% endfor %}

        ],

        datasets: [{

            label: 'Quantidade de Alunos',

            data: [

                {% for faixa in faixas %}

                    {{ faixa[1] }},

                {% endfor %}

            ],

            borderWidth: 2

        }]

    },

    options: {

        responsive: true,

        scales: {

            y: {

                beginAtZero: true

            }

        }

    }

});

</script>

{% endblock %}
