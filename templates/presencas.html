{% extends 'base.html' %}

{% block conteudo %}

<div class="row">

    <div class="col-md-4">

        <div class="card shadow-sm">

            <div class="card-body">

                <h3 class="mb-4">
                    Registrar Presença
                </h3>

                <form method="POST">

                    <div class="mb-3">

                        <label class="form-label">
                            Aluno
                        </label>

                        <select
                            name="aluno_id"
                            class="form-select"
                            required
                        >

                            {% for aluno in alunos %}

                            <option value="{{ aluno.id }}">
                                {{ aluno.nome }}
                            </option>

                            {% endfor %}

                        </select>

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Data
                        </label>

                        <input
                            type="date"
                            name="data"
                            class="form-control"
                            required
                        >

                    </div>

                    <div class="mb-3">

                        <label class="form-label">
                            Status
                        </label>

                        <select
                            name="status"
                            class="form-select"
                        >

                            <option value="PRESENTE">
                                PRESENTE
                            </option>

                            <option value="FALTA">
                                FALTA
                            </option>

                        </select>

                    </div>

                    <button class="btn btn-success w-100">

                        Salvar

                    </button>

                </form>

            </div>

        </div>

    </div>

    <div class="col-md-8">

        <div class="card shadow-sm">

            <div class="card-body">

                <h3 class="mb-4">
                    Lista de Presenças
                </h3>

                <table class="table table-hover">

                    <thead>

                        <tr>

                            <th>Aluno</th>
                            <th>Data</th>
                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>

                        {% for presenca in presencas %}

                        <tr>

                            <td>
                                {{ presenca.aluno.nome }}
                            </td>

                            <td>
                                {{ presenca.data }}
                            </td>

                            <td>

                                {% if presenca.status == 'PRESENTE' %}

                                <span class="badge bg-success">
                                    PRESENTE
                                </span>

                                {% else %}

                                <span class="badge bg-danger">
                                    FALTA
                                </span>

                                {% endif %}

                            </td>

                        </tr>

                        {% endfor %}

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

{% endblock %}
