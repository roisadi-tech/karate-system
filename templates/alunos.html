{% extends 'base.html' %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1>
        Alunos
    </h1>

    <a
        href="/cadastrar_aluno"
        class="btn btn-success"
    >
        <i class="bi bi-plus-circle"></i>
        Novo Aluno
    </a>

</div>

<!-- BUSCA -->

<div class="card shadow-sm mb-4">

    <div class="card-body">

        <form
            method="GET"
            action="/alunos"
        >

            <div class="input-group">

                <input
                    type="text"
                    name="busca"
                    class="form-control"
                    placeholder="Buscar aluno..."
                >

                <button class="btn btn-primary">

                    <i class="bi bi-search"></i>
                    Buscar

                </button>

            </div>

        </form>

    </div>

</div>

<!-- TABELA -->

<div class="card shadow-sm">

    <div class="card-body">

        <table class="table table-hover align-middle">

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Foto</th>
                    <th>Nome</th>
                    <th>Faixa</th>
                    <th>WhatsApp</th>
                    <th>Mensalidade</th>
                    <th>Ações</th>

                </tr>

            </thead>

            <tbody>

                {% for aluno in alunos %}

                <tr>

                    <td>
                        {{ aluno.id }}
                    </td>

                    <td>

                        {% if aluno.foto %}

                        <img
                            src="/static/uploads/{{ aluno.foto }}"
                            width="60"
                            height="60"
                            style="
                                object-fit: cover;
                                border-radius: 50%;
                            "
                        >

                        {% endif %}

                    </td>

                    <td>
                        {{ aluno.nome }}
                    </td>

                    <td>
                        {{ aluno.faixa }}
                    </td>

                    <td>
                        {{ aluno.whatsapp }}
                    </td>

                    <td>
                        R$ {{ aluno.mensalidade }}
                    </td>

                    <td>

                        <a
                            href="/editar_aluno/{{ aluno.id }}"
                            class="btn btn-warning btn-sm"
                        >
                            <i class="bi bi-pencil"></i>
                        </a>

                        <a
                            href="/excluir_aluno/{{ aluno.id }}"
                            class="btn btn-danger btn-sm"
                        >
                            <i class="bi bi-trash"></i>
                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

{% endblock %}
