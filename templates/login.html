<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Login - Karate System
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {

            background: linear-gradient(
                135deg,
                #0f172a,
                #1e293b
            );

            height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .login-card {

            width: 100%;
            max-width: 420px;

            border: none;

            border-radius: 20px;

            overflow: hidden;

        }

        .logo {

            font-size: 60px;

            color: #dc3545;

        }

    </style>

</head>

<body>

<div class="card login-card shadow-lg">

    <div class="card-body p-5">

        <div class="text-center mb-4">

            <i class="bi bi-shield-fill-check logo"></i>

            <h2 class="mt-3">
                Karate System
            </h2>

            <p class="text-muted">
                Painel Administrativo
            </p>

        </div>

        <form method="POST">

            <div class="mb-3">

                <label class="form-label">
                    Usuário
                </label>

                <input
                    type="text"
                    name="usuario"
                    class="form-control"
                    required
                >

            </div>

            <div class="mb-4">

                <label class="form-label">
                    Senha
                </label>

                <input
                    type="password"
                    name="senha"
                    class="form-control"
                    required
                >

            </div>

            <button class="btn btn-danger w-100">

                <i class="bi bi-box-arrow-in-right"></i>
                Entrar

            </button>

        </form>

    </div>

</div>

</body>

</html>
