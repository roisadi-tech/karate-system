<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Login • Karate System

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- Google Fonts -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {

            font-family: 'Poppins', sans-serif;

        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #020617,
                    #0f172a,
                    #111827
                );

            overflow: hidden;

            position: relative;

        }

        /* BACKGROUND */

        .bg-circle {

            position: absolute;

            border-radius: 50%;

            filter: blur(90px);

            opacity: 0.25;

            animation: float 8s ease-in-out infinite;

        }

        .circle1 {

            width: 320px;

            height: 320px;

            background: #dc3545;

            top: -120px;

            left: -120px;

        }

        .circle2 {

            width: 420px;

            height: 420px;

            background: #0d6efd;

            bottom: -180px;

            right: -180px;

        }

        @keyframes float {

            0% {

                transform: translateY(0px);

            }

            50% {

                transform: translateY(20px);

            }

            100% {

                transform: translateY(0px);

            }

        }

        /* CARD */

        .login-card {

            width: 100%;

            max-width: 440px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.1);

            backdrop-filter: blur(22px);

            border-radius: 32px;

            padding: 45px;

            position: relative;

            z-index: 10;

            box-shadow:
                0 25px 50px rgba(0,0,0,0.35);

            animation: aparecer 0.6s ease;

        }

        @keyframes aparecer {

            from {

                opacity: 0;

                transform: translateY(20px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }

        /* LOGO */

        .logo {

            font-size: 34px;

            font-weight: 700;

            color: white;

        }

        .subtitle {

            color: #cbd5e1;

            font-size: 15px;

        }

        /* ÍCONE */

        .icon-box {

            width: 95px;

            height: 95px;

            border-radius: 28px;

            background: rgba(255,255,255,0.12);

            display: flex;

            justify-content: center;

            align-items: center;

            margin: auto;

            margin-bottom: 28px;

            border: 1px solid rgba(255,255,255,0.08);

        }

        .icon-box i {

            font-size: 44px;

            color: white;

        }

        /* LABEL */

        .form-label {

            color: white;

            font-weight: 500;

            margin-bottom: 10px;

        }

        /* INPUT */

        .form-control {

            height: 58px;

            border-radius: 16px;

            border: 1px solid transparent;

            background: rgba(255,255,255,0.10);

            color: white;

            padding-left: 18px;

            transition: 0.3s;

        }

        .form-control:hover {

            background: rgba(255,255,255,0.14);

        }

        .form-control:focus {

            background: rgba(255,255,255,0.16);

            color: white;

            border: 1px solid rgba(220,53,69,0.6);

            box-shadow:
                0 0 0 0.25rem rgba(220,53,69,0.18);

        }

        .form-control::placeholder {

            color: #cbd5e1;

        }

        /* SENHA */

        .senha-box {

            position: relative;

        }

        .toggle-password {

            position: absolute;

            top: 50%;

            right: 18px;

            transform: translateY(-50%);

            cursor: pointer;

            color: #cbd5e1;

            font-size: 20px;

        }

        /* BOTÃO */

        .btn-login {

            height: 58px;

            border-radius: 16px;

            font-weight: 600;

            font-size: 16px;

            background: linear-gradient(
                135deg,
                #dc3545,
                #b91c1c
            );

            border: none;

            transition: 0.3s;

            box-shadow:
                0 10px 25px rgba(220,53,69,0.35);

        }

        .btn-login:hover {

            transform: translateY(-2px);

            box-shadow:
                0 14px 28px rgba(220,53,69,0.45);

        }

        /* ALERT */

        .alert {

            border-radius: 15px;

            border: none;

        }

        /* MOBILE */

        @media (max-width: 576px) {

            .login-card {

                margin: 20px;

                padding: 35px 25px;

            }

        }

    </style>

</head>

<body>

<!-- BACKGROUND -->

<div class="bg-circle circle1"></div>

<div class="bg-circle circle2"></div>

<!-- CARD -->

<div class="login-card">

    <!-- ÍCONE -->

    <div class="icon-box">

        <i class="bi bi-shield-lock-fill"></i>

    </div>

    <!-- LOGO -->

    <div class="text-center mb-4">

        <div class="logo">

            🥋 Karate System

        </div>

        <div class="subtitle mt-2">

            Sistema de Gestão da Academia

        </div>

    </div>

    <!-- ALERTAS -->

    {% with mensagens = get_flashed_messages(with_categories=true) %}

        {% if mensagens %}

            {% for categoria, msg in mensagens %}

                <div
                    class="alert alert-{{ categoria }}"
                >

                    {{ msg }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <!-- FORM -->

    <form method="POST">

        <!-- USUÁRIO -->

        <div class="mb-3">

            <label class="form-label">

                Usuário

            </label>

            <input
                type="text"
                name="usuario"
                class="form-control"
                placeholder="Digite seu usuário"
                required
            >

        </div>

        <!-- SENHA -->

        <div class="mb-4">

            <label class="form-label">

                Senha

            </label>

            <div class="senha-box">

                <input
                    type="password"
                    name="senha"
                    id="senha"
                    class="form-control"
                    placeholder="Digite sua senha"
                    required
                >

                <i
                    class="bi bi-eye-slash-fill toggle-password"
                    id="toggleSenha"
                ></i>

            </div>

        </div>

        <!-- BOTÃO -->

        <button
            class="btn btn-login w-100"
            id="btnLogin"
        >

            <i class="bi bi-box-arrow-in-right"></i>

            Entrar no Sistema

        </button>

    </form>

</div>

<!-- SCRIPT -->

<script>

    // MOSTRAR SENHA

    const toggleSenha = document.getElementById('toggleSenha');

    const senha = document.getElementById('senha');

    toggleSenha.addEventListener('click', () => {

        if (senha.type === 'password') {

            senha.type = 'text';

            toggleSenha.classList.remove(
                'bi-eye-slash-fill'
            );

            toggleSenha.classList.add(
                'bi-eye-fill'
            );

        } else {

            senha.type = 'password';

            toggleSenha.classList.remove(
                'bi-eye-fill'
            );

            toggleSenha.classList.add(
                'bi-eye-slash-fill'
            );

        }

    });

</script>

</body>

</html>
