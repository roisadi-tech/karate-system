<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>

        Login • Karate System

    </title>

    <!-- Bootstrap -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>

        * {

            font-family: 'Poppins', sans-serif;

        }

        body {

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background:
                linear-gradient(
                    135deg,
                    #0f172a,
                    #111827,
                    #1e293b
                );

            overflow: hidden;

        }

        .bg-circle {

            position: absolute;

            border-radius: 50%;

            filter: blur(80px);

            opacity: 0.25;

        }

        .circle1 {

            width: 300px;

            height: 300px;

            background: #dc3545;

            top: -100px;

            left: -100px;

        }

        .circle2 {

            width: 400px;

            height: 400px;

            background: #0d6efd;

            bottom: -150px;

            right: -150px;

        }

        .login-card {

            width: 100%;

            max-width: 430px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.1);

            backdrop-filter: blur(20px);

            border-radius: 30px;

            padding: 45px;

            position: relative;

            z-index: 10;

            box-shadow: 0 20px 40px rgba(0,0,0,0.25);

        }

        .logo {

            font-size: 34px;

            font-weight: 700;

            color: white;

        }

        .subtitle {

            color: #cbd5e1;

        }

        .form-label {

            color: white;

            font-weight: 500;

        }

        .form-control {

            height: 55px;

            border-radius: 15px;

            border: none;

            background: rgba(255,255,255,0.12);

            color: white;

        }

        .form-control:focus {

            background: rgba(255,255,255,0.18);

            color: white;

            border: none;

            box-shadow: 0 0 0 0.2rem rgba(220,53,69,0.25);

        }

        .form-control::placeholder {

            color: #cbd5e1;

        }

        .btn-login {

            height: 55px;

            border-radius: 15px;

            font-weight: 600;

            font-size: 16px;

            background: #dc3545;

            border: none;

            transition: 0.3s;

        }

        .btn-login:hover {

            transform: translateY(-2px);

            background: #bb2d3b;

        }

        .icon-box {

            width: 90px;

            height: 90px;

            border-radius: 25px;

            background: rgba(255,255,255,0.12);

            display: flex;

            justify-content: center;

            align-items: center;

            margin: auto;

            margin-bottom: 25px;

        }

        .icon-box i {

            font-size: 42px;

            color: white;

        }

        .alert {

            border-radius: 15px;

        }

    </style>

</head>

<body>

<!-- BACKGROUND -->

<div class="bg-circle circle1"></div>

<div class="bg-circle circle2"></div>

<!-- CARD -->

<div class="login-card">

    <!-- ÍCONE -->

    <div class="icon-box">

        <i class="bi bi-shield-lock-fill"></i>

    </div>

    <!-- LOGO -->

    <div class="text-center mb-4">

        <div class="logo">

            🥋 Karate System

        </div>

        <div class="subtitle mt-2">

            Sistema de Gestão da Academia

        </div>

    </div>

    <!-- ALERTAS -->

    {% with mensagens = get_flashed_messages() %}

        {% if mensagens %}

            {% for msg in mensagens %}

                <div
                    class="alert alert-danger"
                >

                    {{ msg }}

                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}

    <!-- FORM -->

    <form method="POST">

        <!-- USUÁRIO -->

        <div class="mb-3">

            <label class="form-label">

                Usuário

            </label>

            <input
                type="text"
                name="usuario"
                class="form-control"
                placeholder="Digite seu usuário"
                required
            >

        </div>

        <!-- SENHA -->

        <div class="mb-4">

            <label class="form-label">

                Senha

            </label>

            <input
                type="password"
                name="senha"
                class="form-control"
                placeholder="Digite sua senha"
                required
            >

        </div>

        <!-- BOTÃO -->

        <button
            class="btn btn-danger btn-login w-100"
        >

            <i class="bi bi-box-arrow-in-right"></i>

            Entrar no Sistema

        </button>

    </form>

</div>

</body>

</html>
