{% extends 'base.html' %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">
            👨‍🎓 Cadastrar Aluno
        </h2>

        <p class="text-muted mb-0">
            Adicione novos alunos à academia
        </p>

    </div>

</div>

<!-- FORM -->

<div class="card border-0 shadow-sm p-4 rounded-4">

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="row g-4">

            <!-- FOTO -->

            <div class="col-lg-4">

                <div class="text-center">

                    <img
                        id="preview"
                        src="https://cdn-icons-png.flaticon.com/512/149/149071.png"
                        class="img-fluid rounded-circle shadow-sm mb-3"
                        style="
                            width: 250px;
                            height: 250px;
                            object-fit: cover;
                            border: 5px solid #f1f5f9;
                        "
                    >

                    <input
                        type="file"
                        name="foto"
                        class="form-control"
                        accept=".png,.jpg,.jpeg,.webp"
                        onchange="previewImagem(event)"
                    >

                    <small class="text-muted d-block mt-2">
                        PNG, JPG, JPEG ou WEBP
                    </small>

                </div>

            </div>

            <!-- DADOS -->

            <div class="col-lg-8">

                <div class="row g-3">

                    <!-- NOME -->

                    <div class="col-md-12">

                        <label class="form-label fw-semibold">
                            Nome Completo
                        </label>

                        <input
                            type="text"
                            name="nome"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <!-- NASCIMENTO -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Data de Nascimento
                        </label>

                        <input
                            type="date"
                            name="nascimento"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <!-- SEXO -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Sexo
                        </label>

                        <select
                            name="sexo"
                            class="form-select form-select-lg"
                            required
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="Masculino">
                                Masculino
                            </option>

                            <option value="Feminino">
                                Feminino
                            </option>

                        </select>

                    </div>

                    <!-- RESPONSÁVEL -->

                    <div class="col-md-12">

                        <label class="form-label fw-semibold">
                            Responsável
                        </label>

                        <input
                            type="text"
                            name="responsavel"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <!-- WHATSAPP -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            WhatsApp
                        </label>

                        <input
                            type="text"
                            name="whatsapp"
                            class="form-control form-control-lg"
                            placeholder="88999999999"
                            required
                        >

                    </div>

                    <!-- TURMA -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Turma
                        </label>

                        <input
                            type="text"
                            name="turma"
                            class="form-control form-control-lg"
                            placeholder="Ex: Infantil 18h"
                        >

                        <small class="text-muted">
                            Exemplo: Infantil 18h, Adultos 19h, Competição
                        </small>

                    </div>

                    <!-- PROFESSOR -->

                    <div class="col-md-6">

                        <label class="form-label fw-semibold">
                            Professor
                        </label>

                        <select
                            name="professor"
                            class="form-select form-select-lg"
                        >

                            <option value="">
                                Selecione
                            </option>

                            <option value="Diego">
                                Diego
                            </option>

                            <option value="Robyson">
                                Robyson
                            </option>

                        </select>

                    </div>

                    <!-- FAIXA -->

                    <div class="col-md-3">

                        <label class="form-label fw-semibold">
                            Faixa
                        </label>

                        <select
                            name="faixa"
                            class="form-select form-select-lg"
                            required
                        >

                            <option value="Branca">Branca</option>
                            <option value="Cinza">Cinza</option>
                            <option value="Azul">Azul</option>
                            <option value="Amarela">Amarela</option>
                            <option value="Laranja">Laranja</option>
                            <option value="Verde">Verde</option>
                            <option value="Roxa">Roxa</option>
                            <option value="Marrom">Marrom</option>
                            <option value="Preta">Preta</option>

                        </select>

                    </div>

                    <!-- MENSALIDADE -->

                    <div class="col-md-3">

                        <label class="form-label fw-semibold">
                            Mensalidade
                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="mensalidade"
                            class="form-control form-control-lg"
                            placeholder="80.00"
                            required
                        >

                    </div>

                </div>

            </div>

        </div>

        <!-- BOTÕES -->

        <div class="mt-5 d-flex gap-3">

            <button
                class="btn btn-danger btn-lg px-4"
            >

                <i class="bi bi-person-plus-fill"></i>

                Cadastrar Aluno

            </button>

            <a
                href="/alunos"
                class="btn btn-secondary btn-lg px-4"
            >

                Voltar

            </a>

        </div>

    </form>

</div>

<!-- PREVIEW FOTO -->

<script>

function previewImagem(event) {

    const reader = new FileReader()

    reader.onload = function() {

        const output = document.getElementById('preview')

        output.src = reader.result

    }

    reader.readAsDataURL(event.target.files[0])

}

</script>

{% endblock %}
