{% extends 'base.html' %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">
            👨‍🎓 Cadastrar Aluno
        </h2>

        <p class="text-muted mb-0">
            Adicione novos alunos à academia
        </p>

    </div>

</div>

<!-- FORM -->

<div class="card p-4">

    <form
        method="POST"
        enctype="multipart/form-data"
    >

        <div class="row g-4">

            <!-- FOTO -->

            <div class="col-md-4">

                <div class="text-center">

                    <div
                        class="bg-light rounded-4 d-flex align-items-center justify-content-center mb-3"
                        style="height: 300px;"
                    >

                        <i
                            class="bi bi-person-circle text-secondary"
                            style="font-size: 120px;"
                        ></i>

                    </div>

                    <input
                        type="file"
                        name="foto"
                        class="form-control"
                    >

                </div>

            </div>

            <!-- DADOS -->

            <div class="col-md-8">

                <div class="row g-3">

                    <!-- NOME -->

                    <div class="col-md-12">

                        <label class="form-label">

                            Nome Completo

                        </label>

                        <input
                            type="text"
                            name="nome"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <!-- NASCIMENTO -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Data de Nascimento

                        </label>

                        <input
                            type="date"
                            name="nascimento"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <!-- RESPONSÁVEL -->

                    <div class="col-md-6">

                        <label class="form-label">

                            Responsável

                        </label>

                        <input
                            type="text"
                            name="responsavel"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                    <!-- WHATSAPP -->

                    <div class="col-md-6">

                        <label class="form-label">

                            WhatsApp

                        </label>

                        <input
                            type="text"
                            name="whatsapp"
                            class="form-control form-control-lg"
                            placeholder="85999999999"
                            required
                        >

                    </div>

                    <!-- FAIXA -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Faixa

                        </label>

                        <select
                            name="faixa"
                            class="form-select form-select-lg"
                            required
                        >

                            <option value="Branca">
                                Branca
                            </option>

                            <option value="Cinza">
                                Cinza
                            </option>

                            <option value="Azul">
                                Azul
                            </option>

                            <option value="Amarela">
                                Amarela
                            </option>

                            <option value="Laranja">
                                Laranja
                            </option>

                            <option value="Verde">
                                Verde
                            </option>

                            <option value="Roxa">
                                Roxa
                            </option>

                            <option value="Marrom">
                                Marrom
                            </option>

                            <option value="Preta">
                                Preta
                            </option>

                        </select>

                    </div>

                    <!-- MENSALIDADE -->

                    <div class="col-md-3">

                        <label class="form-label">

                            Mensalidade

                        </label>

                        <input
                            type="number"
                            step="0.01"
                            name="mensalidade"
                            class="form-control form-control-lg"
                            required
                        >

                    </div>

                </div>

            </div>

        </div>

        <!-- BOTÕES -->

        <div class="mt-5 d-flex gap-3">

            <button
                class="btn btn-danger btn-lg"
            >

                <i class="bi bi-person-plus-fill"></i>

                Cadastrar Aluno

            </button>

            <a
                href="/alunos"
                class="btn btn-secondary btn-lg"
            >

                Voltar

            </a>

        </div>

    </form>

</div>

{% endblock %}
