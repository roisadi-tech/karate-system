{% extends 'base.html' %}

{% block conteudo %}

<div class="card shadow-sm">

    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>
                Cadastrar Aluno
            </h1>

            <a
                href="/alunos"
                class="btn btn-secondary"
            >
                Voltar
            </a>

        </div>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Data Nascimento
                    </label>

                    <input
                        type="date"
                        name="nascimento"
                        class="form-control"
                    >

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Responsável
                    </label>

                    <input
                        type="text"
                        name="responsavel"
                        class="form-control"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        WhatsApp
                    </label>

                    <input
                        type="text"
                        name="whatsapp"
                        class="form-control"
                    >

                </div>

            </div>

            <div class="row">

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Faixa
                    </label>

                    <input
                        type="text"
                        name="faixa"
                        class="form-control"
                    >

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Mensalidade
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="mensalidade"
                        class="form-control"
                    >

                </div>

                <div class="col-md-4 mb-3">

                    <label class="form-label">
                        Foto
                    </label>

                    <input
                        type="file"
                        name="foto"
                        class="form-control"
                    >

                </div>

            </div>

            <button class="btn btn-success">

                <i class="bi bi-check-circle"></i>
                Salvar Aluno

            </button>

        </form>

    </div>

</div>

{% endblock %}
