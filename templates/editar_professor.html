{% extends 'base.html' %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold">
            ✏️ Editar Professor
        </h2>

        <p class="text-muted mb-0">
            Atualize os dados do professor
        </p>

    </div>

</div>

<div class="card border-0 shadow-sm p-4 rounded-4">

    <form method="POST">

        <div class="row g-3">

            <div class="col-md-12">

                <label class="form-label fw-semibold">
                    Nome do Professor
                </label>

                <input
                    type="text"
                    name="nome"
                    value="{{ professor.nome }}"
                    class="form-control form-control-lg"
                    required
                >

            </div>

            <div class="col-md-6">

                <label class="form-label fw-semibold">
                    Telefone / WhatsApp
                </label>

                <input
                    type="text"
                    name="telefone"
                    value="{{ professor.telefone or '' }}"
                    class="form-control form-control-lg"
                    placeholder="88999999999"
                >

            </div>

            <div class="col-md-12">

                <label class="form-label fw-semibold">
                    Observação
                </label>

                <textarea
                    name="observacao"
                    class="form-control"
                    rows="4"
                    placeholder="Ex: Professor responsável pelas turmas infantis"
                >{{ professor.observacao or '' }}</textarea>

            </div>

        </div>

        <div class="mt-5 d-flex gap-3">

            <button class="btn btn-warning text-white btn-lg px-4">

                <i class="bi bi-save-fill"></i>
                Salvar Alterações

            </button>

            <a
                href="/professores"
                class="btn btn-secondary btn-lg px-4"
            >
                Voltar
            </a>

        </div>

    </form>

</div>

{% endblock %}
