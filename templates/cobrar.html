{% extends 'base.html' %}

{% block conteudo %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <h1>
        Cobranças Pendentes
    </h1>

    <button
        onclick="cobrarTodos()"
        class="btn btn-danger"
    >
        <i class="bi bi-whatsapp"></i>
        Cobrar Todos
    </button>

</div>

<div class="card shadow-sm">

    <div class="card-body">

        <table class="table table-hover align-middle">

            <thead>

                <tr>

                    <th>Aluno</th>
                    <th>WhatsApp</th>
                    <th>Valor</th>
                    <th>Vencimento</th>
                    <th>Ação</th>

                </tr>

            </thead>

            <tbody>

                {% for item in dados %}

                <tr>

                    <td>
                        {{ item.aluno.nome }}
                    </td>

                    <td>
                        {{ item.aluno.whatsapp }}
                    </td>

                    <td>
                        R$ {{ item.valor }}
                    </td>

                    <td>
                        {{ item.vencimento }}
                    </td>

                    <td>

                        <a
                            href="https://wa.me/55{{ item.aluno.whatsapp }}?text=Olá {{ item.aluno.nome }}, sua mensalidade de R$ {{ item.valor }} está pendente. Vencimento: {{ item.vencimento }}"
                            target="_blank"
                            class="btn btn-success btn-sm link-whatsapp"
                        >

                            <i class="bi bi-whatsapp"></i>
                            Cobrar

                        </a>

                    </td>

                </tr>

                {% endfor %}

            </tbody>

        </table>

    </div>

</div>

<script>

function cobrarTodos() {

    const links = document.querySelectorAll('.link-whatsapp');

    links.forEach((link, index) => {

        setTimeout(() => {

            window.open(
                link.href,
                '_blank'
            );

        }, index * 1000);

    });

}

</script>

{% endblock %}
