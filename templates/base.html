<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Karate System
    </title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {

            background: #f1f5f9;

        }

        .sidebar {

            width: 260px;

            min-height: 100vh;

            background: #0f172a;

        }

        .sidebar .nav-link {

            color: #cbd5e1;

            margin-bottom: 8px;

            border-radius: 10px;

            padding: 12px;

            transition: 0.2s;

        }

        .sidebar .nav-link:hover {

            background: #1e293b;

            color: white;

            transform: translateX(4px);

        }

        .sidebar .nav-link.active {

            background: #dc3545;

            color: white;

        }

        .content {

            flex: 1;

            padding: 30px;

        }

        .logo {

            font-size: 28px;

            font-weight: bold;

            color: white;

        }

        .usuario-box {

            background: #1e293b;

            border-radius: 12px;

            padding: 12px;

            color: white;

            margin-bottom: 20px;

        }

        .badge-admin {

            background: #dc3545;

        }

        .badge-user {

            background: #198754;

        }

    </style>

</head>

<body>

<div class="d-flex">

    <!-- SIDEBAR -->

    <div class="sidebar p-3">

        <div class="logo mb-4">

            🥋 Karate System

        </div>

        <!-- USUÁRIO -->

        <div class="usuario-box">

            <div>
                <strong>
                    {{ session.usuario }}
                </strong>
            </div>

            <span class="badge
                {% if session.tipo == 'admin' %}
                    badge-admin
                {% else %}
                    badge-user
                {% endif %}
            ">
                {{ session.tipo }}
            </span>

        </div>

        <nav class="nav flex-column">

            <a href="/" class="nav-link">
                <i class="bi bi-speedometer2"></i>
                Dashboard
            </a>

            <a href="/alunos" class="nav-link">
                <i class="bi bi-people"></i>
                Alunos
            </a>

            <a href="/presencas" class="nav-link">
                <i class="bi bi-check2-square"></i>
                Presenças
            </a>

            <a href="/frequencia" class="nav-link">
                <i class="bi bi-graph-up"></i>
                Frequência
            </a>

            <a href="/mensalidades" class="nav-link">
                <i class="bi bi-cash-stack"></i>
                Mensalidades
            </a>

            <a href="/cobrar" class="nav-link">
                <i class="bi bi-whatsapp"></i>
                Cobranças
            </a>

            <a href="/exames" class="nav-link">
                <i class="bi bi-award"></i>
                Exames
            </a>

            <a href="/relatorios" class="nav-link">
                <i class="bi bi-bar-chart"></i>
                Relatórios
            </a>

            <!-- APENAS ADMIN -->

            {% if session.tipo == 'admin' %}

            <a href="/backup" class="nav-link">
                <i class="bi bi-download"></i>
                Backup
            </a>

            <a href="/usuarios" class="nav-link">
                <i class="bi bi-person-gear"></i>
                Usuários
            </a>

            {% endif %}

            <hr class="text-secondary">

            <a
                href="/logout"
                class="nav-link text-danger"
            >
                <i class="bi bi-box-arrow-right"></i>
                Sair
            </a>

        </nav>

    </div>

    <!-- CONTEÚDO -->

    <div class="content">

        {% block conteudo %}
        {% endblock %}

    </div>

</div>

</body>

</html>
