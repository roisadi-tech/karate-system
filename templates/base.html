<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Sistema Karatê
    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <style>

        body {

            background-color: #f5f6fa;

        }

        .sidebar {

            width: 250px;
            height: 100vh;

            position: fixed;

            background: #111827;

            padding-top: 20px;

        }

        .sidebar h3 {

            color: white;

            text-align: center;

            margin-bottom: 30px;

        }

        .sidebar a {

            display: block;

            color: #d1d5db;

            text-decoration: none;

            padding: 14px 20px;

            transition: 0.3s;

        }

        .sidebar a:hover {

            background: #1f2937;

            color: white;

        }

        .content {

            margin-left: 250px;

            padding: 30px;

        }

        .card {

            border: none;

            border-radius: 15px;

        }

    </style>

</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

    <h3>
        🥋 Karatê System
    </h3>

    <a href="/">
        <i class="bi bi-speedometer2"></i>
        Dashboard
    </a>

    <a href="/alunos">
        <i class="bi bi-people"></i>
        Alunos
    </a>

    <a href="/presencas">
        <i class="bi bi-check2-square"></i>
        Presenças
    </a>

    <a href="/frequencia">
        <i class="bi bi-bar-chart"></i>
        Frequência
    </a>

    <a href="/mensalidades">
        <i class="bi bi-cash-stack"></i>
        Mensalidades
    </a>

    <a href="/cobrar">
        <i class="bi bi-whatsapp"></i>
        Cobranças
    </a>

    <a href="/exames">
        <i class="bi bi-award"></i>
        Exames
    </a>

    <a href="/relatorios">
        <i class="bi bi-graph-up"></i>
        Relatórios
    </a>

    <a href="/logout">
        <i class="bi bi-box-arrow-right"></i>
        Sair
    </a>

</div>

<!-- CONTEÚDO -->

<div class="content">

    {% block conteudo %}

    {% endblock %}

</div>

</body>
</html>
