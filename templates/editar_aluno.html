{% extends 'base.html' %}

{% block conteudo %}

<div class="card shadow-sm">

    <div class="card-body">

        <div class="d-flex justify-content-between align-items-center mb-4">

            <h1>
                Editar Aluno
            </h1>

            <a
                href="/alunos"
                class="btn btn-secondary"
            >
                Voltar
            </a>

        </div>

        <form
            method="POST"
            enctype="multipart/form-data"
        >

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Nome
                    </label>

                    <input
                        type="text"
                        name="nome"
                        class="form-control"
                        value="{{ aluno.nome }}"
                        required
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        WhatsApp
                    </label>

                    <input
                        type="text"
                        name="whatsapp"
                        class="form-control"
                        value="{{ aluno.whatsapp }}"
                    >

                </div>

            </div>

            <div class="row">

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Faixa
                    </label>

                    <input
                        type="text"
                        name="faixa"
                        class="form-control"
                        value="{{ aluno.faixa }}"
                    >

                </div>

                <div class="col-md-6 mb-3">

                    <label class="form-label">
                        Mensalidade
                    </label>

                    <input
                        type="number"
                        step="0.01"
                        name="mensalidade"
                        class="form-control"
                        value="{{ aluno.mensalidade }}"
                    >

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">
                    Nova Foto
                </label>

                <input
                    type="file"
                    name="foto"
                    class="form-control"
                >

            </div>

            {% if aluno.foto %}

            <div class="mb-4">

                <img
                    src="/static/uploads/{{ aluno.foto }}"
                    width="120"
                    class="rounded-circle"
                    style="object-fit: cover;"
                >

            </div>

            {% endif %}

            <button class="btn btn-success">

                <i class="bi bi-check-circle"></i>
                Atualizar

            </button>

        </form>

    </div>

</div>

{% endblock %}
